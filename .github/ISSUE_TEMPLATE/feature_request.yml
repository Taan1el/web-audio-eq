name: Feature request
description: Suggest something the EQ should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the listening problem, not the control you have in mind. Knowing the goal often turns up a better answer than the requested feature.
      placeholder: Podcasts on this one site are quiet and boomy, and I have to redo the same three adjustments every time.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: Your proposed solution, if you have one.

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried
      description: Existing controls, presets, or other tools — and why they fell short.

  - type: checkboxes
    id: budget
    attributes:
      label: Popup space
      description: |
        Chrome caps the popup at 600px tall and the current layout uses 587px. Any new
        visible control means an existing one has to shrink or go.
      options:
        - label: This needs no new UI, or I've said what it should replace.
