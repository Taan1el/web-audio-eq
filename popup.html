<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #27374e;
      --panel: #223149;
      --text: #e8edf2;
      --muted: #9fb0c3;
      --line: rgba(233, 240, 248, 0.7);
      --grid: rgba(233, 240, 248, 0.12);
      --node: #f4f7fb;
      --accent: #e0413c;
      --btn-border: #5a6b82;
    }
    * { box-sizing: border-box; }
    body {
      width: 760px;
      margin: 0;
      padding: 14px 18px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      user-select: none;
    }
    header h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: .3px; }

    .controls-row { display: flex; gap: 10px; align-items: stretch; }
    .vol { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .vol .lbl { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .vol input[type="range"] {
      writing-mode: vertical-lr; direction: rtl;
      width: 22px; height: 248px; accent-color: var(--node);
    }
    .eq-wrap { flex: 1; position: relative; }
    svg#eq { display: block; width: 100%; height: 286px; background: transparent; touch-action: none; }
    svg#eq text { fill: var(--muted); font-size: 10px; }
    svg#eq line { stroke: var(--grid); }
    .curve { fill: none; stroke: var(--line); stroke-width: 2; }
    .node { fill: var(--node); cursor: ns-resize; }

    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .actions input[type="text"] {
      background: var(--panel); border: 1px solid var(--btn-border);
      color: var(--text); border-radius: 5px; padding: 5px 8px; font-size: 12px; width: 120px;
    }
    button.b {
      padding: 5px 10px; font-size: 12px; color: var(--text);
      background: var(--panel); border: 1px solid var(--btn-border);
      border-radius: 5px; cursor: pointer;
    }
    button.b:hover { background: #34486a; }
    button.b.on { background: var(--accent); border-color: var(--accent); }
    .center-row { text-align: center; margin-top: 10px; }

    .tone { display: flex; gap: 16px; margin-top: 10px; padding: 8px 4px 2px; border-top: 1px solid var(--grid); }
    .tone .t { flex: 1; }
    .tone label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .tone label .v { color: var(--accent); font-variant-numeric: tabular-nums; }
    .tone input[type="range"] { width: 100%; accent-color: var(--node); }
  </style>
</head>
<body>
  <header>
    <h1>SoundCloud EQ</h1>
  </header>

  <div class="controls-row">
    <div class="vol">
      <span class="lbl">volume</span>
      <input type="range" id="volume" min="0" max="2" step="0.01" />
    </div>
    <div class="eq-wrap">
      <svg id="eq" viewBox="0 0 660 380" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div class="tone">
    <div class="t"><label>Bass <span class="v" id="bassVal"></span></label><input type="range" id="bass" min="-12" max="12" step="0.5" /></div>
    <div class="t"><label>Mid <span class="v" id="midVal"></span></label><input type="range" id="mid" min="-12" max="12" step="0.5" /></div>
    <div class="t"><label>Treble <span class="v" id="trebleVal"></span></label><input type="range" id="treble" min="-12" max="12" step="0.5" /></div>
    <div class="t"><label>Preamp <span class="v" id="preampVal"></span></label><input type="range" id="preamp" min="-12" max="12" step="0.5" /></div>
  </div>

  <div class="actions">
    <input type="text" id="presetName" placeholder="Preset Name" list="presetList" />
    <datalist id="presetList"></datalist>
    <button class="b" id="savePreset">+ Save Preset</button>
    <button class="b" id="deletePreset">- Delete Preset</button>
    <button class="b" id="reset">Reset Filters</button>
    <button class="b" id="bassBoost">Bass Boost</button>
  </div>

  <div class="center-row">
    <button class="b" id="stopBtn">Stop EQing</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
